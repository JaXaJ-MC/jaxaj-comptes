security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        comptes:
            entity: { class: App\Entity\Compte }  # CompteRepository::loadUserByIdentifier

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        # Connexion par e-mail et mot de passe, renouvellement du jeton.
        connexion:
            pattern: ^/api/connexion
            stateless: true
            provider: comptes
            user_checker: App\Security\VerificateurCompte
            json_login:
                check_path: /api/connexion
                username_path: email
                password_path: mot_de_passe
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            refresh_jwt:
                check_path: /api/connexion/renouveler

        # API : un JWT valide est exigé.
        api:
            pattern: ^/api
            stateless: true
            provider: comptes
            user_checker: App\Security\VerificateurCompte
            jwt: ~

        # Pages publiques : choisir ou réinitialiser son mot de passe (lien reçu par e-mail).
        public:
            security: false

    access_control:
        - { path: ^/api/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/api/comptes, roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
